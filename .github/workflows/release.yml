name: Release CLI
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: memoguard-cli
      - uses: actions/checkout@v4
        with:
          repository: Memoguard8876/memoguard-rules
          ref: v0.1.0
          path: memoguard-rules
          token: ${{ secrets.MODULES_READ_TOKEN }}
      - uses: actions/checkout@v4
        with:
          repository: Memoguard8876/memoguard-engine
          ref: v0.1.0
          path: memoguard-engine
          token: ${{ secrets.MODULES_READ_TOKEN }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: memoguard-cli/go.mod
      - run: go work init ./memoguard-rules ./memoguard-engine ./memoguard-cli
      - run: go work edit -replace=github.com/memoguard8876/memoguard-rules=./memoguard-rules -replace=github.com/memoguard8876/memoguard-engine=./memoguard-engine
      - name: Build binaries
        working-directory: memoguard-cli
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            suffix=""
            if [ "$os" = windows ]; then suffix=.exe; fi
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -o "dist/memoguard-${os}-${arch}${suffix}" ./cmd/memoguard
          done
          (cd dist && sha256sum memoguard-* > SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with:
          files: memoguard-cli/dist/*
