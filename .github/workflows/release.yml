name: Release CLI
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify source
        run: |
          go test ./...
          go vet ./...
      - name: Build binaries
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            suffix=""
            if [ "$os" = windows ]; then suffix=.exe; fi
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -o "dist/memoguard-${os}-${arch}${suffix}" ./cmd/memoguard
          done
          (cd dist && sha256sum memoguard-* > SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
